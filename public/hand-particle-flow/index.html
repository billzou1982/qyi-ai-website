<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand-Controlled 3D Particle Flow</title>
    <script type="module" crossorigin src="./assets/index-VUmino6K.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C6jVikyk.css">
  </head>
  <body>
    <!-- Start Experience Overlay -->
    <div id="start-overlay">
      <div class="start-content">
        <h1 class="start-title">Hand-Controlled Particle Flow</h1>
        <p class="start-subtitle">体验手势控制的"Hello"粒子文字</p>
        <div class="start-description">
          <p style="margin-bottom: 1rem;">使用您的摄像头追踪手部动作，通过手势控制粒子：</p>
          <ul style="text-align: left; max-width: 400px; margin: 0 auto; line-height: 1.8;">
            <li>☝️ <strong>一根手指</strong>：移动文字位置</li>
            <li>✌️ <strong>两根手指</strong>：捏合缩放文字大小</li>
            <li>✊ <strong>握拳</strong>：打散粒子</li>
            <li>🖐️ <strong>张开手掌</strong>：重新聚合文字</li>
          </ul>
        </div>
        <button id="start-btn" class="start-button">开始体验</button>
        <p class="start-notice">点击后将请求摄像头权限</p>
      </div>
    </div>

    <!-- Hidden video element for webcam capture -->
    <video id="webcam" style="display: none;"></video>

    <!-- Canvas container for Three.js rendering -->
    <div id="canvas-container"></div>

    <!-- Loading indicator -->
    <div id="loading" style="display: none;">
      <div class="loading-text">Initializing Hand Tracking...</div>
      <div class="loading-subtext">Please allow camera access</div>
    </div>

  </body>
</html>
